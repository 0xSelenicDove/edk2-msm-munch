name: Build Munch (POCO F4 / Redmi K40S) UEFI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Munch UEFI Boot Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99timeout
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99timeout
          sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            uuid-dev \
            iasl \
            git \
            nasm \
            python-is-python3 \
            python3-pip \
            python3-pil \
            python3-git \
            gettext \
            gcc-aarch64-linux-gnu \
            clang \
            llvm \
            device-tree-compiler \
            abootimg \
            libsdl2-2.0-0 \
            libsdl2-dev

      - name: Build UEFI Boot Image for Munch
        run: |
          ./build.sh --device munch --release RELEASE

      - name: Build Flashable Installer Zip for Munch
        run: |
          ./build.sh --device munch --installer-zip

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p artifacts
          cp -v Build/munch/RELEASE_CLANG38/FV/SM8250_UEFI.fd artifacts/SM8250_UEFI.fd 2>/dev/null || true
          cp -v boot-*.img artifacts/ 2>/dev/null || true
          cp -v uefi-installer-*.zip artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: munch-uefi-build-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: munch-uefi-${{ github.sha }}
          name: Munch UEFI Bootloader Build (${{ github.sha }})
          body: |
            ## Munch (POCO F4 / Redmi K40S) UEFI Image
            - **Commit**: `${{ github.sha }}`
            - **Device**: Xiaomi POCO F4 / Redmi K40S (`munch`)
            - **Platform**: Qualcomm Snapdragon 870 (`SM8250`)
          files: |
            artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
