name: Build Munch (POCO F4 / Redmi K40S) UEFI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Munch UEFI Boot Image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Configure Fast Azure Mirror & Install dependencies
        run: |
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iasl \
            device-tree-compiler \
            abootimg \
            python3-pil \
            python-is-python3 \
            uuid-dev \
            nasm \
            gcc-aarch64-linux-gnu \
            build-essential \
            gettext \
            clang \
            llvm

      - name: Build UEFI Boot Image for Munch
        run: |
          ./build.sh --device munch --release RELEASE

      - name: Build Flashable Installer Zip for Munch
        run: |
          ./build.sh --device munch --installer-zip

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p artifacts
          cp -v Build/munch/RELEASE_CLANG38/FV/SM8250_UEFI.fd artifacts/SM8250_UEFI.fd 2>/dev/null || true
          find Build/munch/RELEASE_CLANG38 -type f -name 'SimpleInitMain.efi' -exec cp -v '{}' artifacts/SimpleInitMain.efi \; -quit
          find Build/munch/RELEASE_CLANG38 -type f -name 'Reboot2PayloadApp.efi' -exec cp -v '{}' artifacts/Reboot2PayloadApp.efi \; -quit
          cp -v Platform/Xiaomi/sm8250/munch.multiboot.uefi.conf artifacts/simpleinit.static.uefi.cfg
          cp -v boot-*.img artifacts/ 2>/dev/null || true
          cp -v uefi-installer-*.zip artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: munch-uefi-build-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: munch-uefi-${{ github.sha }}
          name: Munch UEFI Bootloader Build (${{ github.sha }})
          body: |
            ## Munch (POCO F4 / Redmi K40S) UEFI Image
            - **Commit**: `${{ github.sha }}`
            - **Device**: Xiaomi POCO F4 / Redmi K40S (`munch`)
            - **Platform**: Qualcomm Snapdragon 870 (`SM8250`)
          files: |
            artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
