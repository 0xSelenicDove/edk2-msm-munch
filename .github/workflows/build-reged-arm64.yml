name: Build static ARM64 registry and SAM tools

on:
  push:
    branches:
      - tools/reged-arm64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build static reged and chntpw
        run: |
          git clone --depth 1 https://github.com/rescatux/chntpw.git
          make -C chntpw CC=aarch64-linux-gnu-gcc CFLAGS='-O2 -Wall -fsigned-char' reged.static chntpw.static
          aarch64-linux-gnu-gcc -static -O2 -o chntpw/argv-dump .github/tools/argv-dump.c
          file chntpw/reged.static
          file chntpw/chntpw.static
          aarch64-linux-gnu-readelf -l chntpw/reged.static | grep -qv INTERP
          aarch64-linux-gnu-readelf -l chntpw/chntpw.static | grep -qv INTERP

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-offline-tools-static-aarch64
          path: |
            chntpw/reged.static
            chntpw/chntpw.static
            chntpw/argv-dump
          if-no-files-found: error
